<div class="container mt-4">
  <div class="row mb-3">
    <div class="col-md-8">
      <h2>{{ searchTitle }}</h2>
    </div>

    <div class="col-md-4">
      <select
        class="form-select"
        name="selectedCategory"
        [(ngModel)]="selectedCategory"
        (change)="changeCategory()">
        <option *ngFor="let category of categories" [value]="category">
          {{ category }}
        </option>
      </select>
    </div>
  </div>

  <div *ngIf="loading" class="alert alert-info">
    Loading recipes...
  </div>

  <div *ngIf="!loading && errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && !errorMessage && meals.length === 0" class="alert alert-warning">
    No recipes found. Try another search.
  </div>

  <div class="row">
    <div class="col-12 col-md-4 mb-4" *ngFor="let meal of meals">
      <app-recipe-card [meal]="meal"></app-recipe-card>
    </div>
  </div>
</div>

<div class="container mt-4">
  <h2 class="mb-3">{{ searchTitle }}</h2>

  <div *ngIf="loading" class="alert alert-info">
    Loading recipes...
  </div>

  <div *ngIf="!loading && errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && !errorMessage && meals.length === 0" class="alert alert-warning">
    No recipes found. Try another search.
  </div>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let meal of meals">
      <app-recipe-card [meal]="meal"></app-recipe-card>
    </div>
  </div>
</div>

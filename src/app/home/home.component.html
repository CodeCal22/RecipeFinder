<div class="container my-5">

    <section class="my-5 p-5 bg-light border rounded text-center">
    <h2>Ready to cook something amazing?</h2>
    <p class="text-muted mb-4">Start exploring recipes now</p>
    <a routerLink="/recipes" class="btn btn-success">Browse Recipes</a>
  </section>

    <section class="my-5">
    <h2 class="text-center mb-4">How it works</h2>

    <div class="row">
      <div class="col-md-4 mb-3">
        <div class="card h-100 text-center">
          <div class="card-body">
            <div class="step-icon">🔍</div>
            <h5>Search</h5>
            <p class="text-muted">Search for a recipe or category</p>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-3">
        <div class="card h-100 text-center">
          <div class="card-body">
            <div class="step-icon">🍽️</div>
            <h5>Browse</h5>
            <p class="text-muted">Browse the results</p>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-3">
        <div class="card h-100 text-center">
          <div class="card-body">
            <div class="step-icon">👨‍🍳</div>
            <h5>Cook</h5>
            <p class="text-muted">View full cooking instructions</p>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="my-5">
    <h2 class="text-center mb-4">Browse Categories</h2>

    <div class="row">
      <div class="col-sm-6 col-md-4 col-lg-3 mb-4" *ngFor="let category of categories">
        <div class="card h-100 text-center category-card" (click)="openCategory(category.name)">
          <div class="card-body">
            <img [src]="category.image" [alt]="category.name" class="category-img mb-3">
            <h5 class="card-title">{{ category.name }}</h5>
          </div>
        </div>
      </div>
    </div>
  </section>





  <section class="my-5 text-center">
    <h3>Today’s Inspiration 🍝</h3>
    <p class="lead">{{ todayIdea }}</p>
  </section>
</div>

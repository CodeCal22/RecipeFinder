<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/">RecipeFinder</a>

    <form class="d-flex" (ngSubmit)="searchRecipe()">
      <input
        class="form-control me-2"
        type="search"
        name="searchText"
        placeholder="Search recipes"
        [(ngModel)]="searchText"
        (ngModelChange)="searchOnTyping()">
      <button class="btn btn-outline-light" type="submit">Search</button>
    </form>
  </div>
</nav>
